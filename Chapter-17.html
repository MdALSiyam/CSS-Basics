<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
          width: 500px;
          height: 200px;
          background-image: url("https://cdn.pixabay.com/photo/2022/09/21/17/02/blue-background-7470781_640.jpg");
          background-repeat: no-repeat;
          background-position: left top;
          background-size: cover;
        }
        p {
          margin: 10px;
          padding: 10px;
          line-height: 20px;
          text-align: center;
          background-color: aquamarine;
          background-attachment: fixed;
          background-origin: border-box;
          background-clip: content-box;
        }

    </style>
</head>
<body>
  <h1>CSS Background Properties</h1>
  <hr><br>
  <div><p>Md. Abdul Latif Siyam</p>
  <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Numquam ducimus, ullam commodi nulla optio quas totam porro, deserunt sint nihil laboriosam, officiis culpa? Consequatur, temporibus! Ea est cumque nobis quis.</p></div>
</body>
</html>
