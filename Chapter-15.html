<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container {
      text-align: center;
    }
    .box {
      width: 200px;
      height: 100px;
      margin: 10px;
      color: white;
      line-height: 100px;
    }
    .name {
      background-color: tomato;
    }
    .hex {
      background-color: #3498db;
    }
    .rgb {
      background-color: rgb(46, 204, 113);
    }
    .rgba {
      background-color: rgba(255, 99, 71, 0.5);
    }
  </style>
</head>
<body>
<h1>CSS Colors</h1>
  <div class="container">
    <div class="box name"><p>Name Color</p></div>
    <div class="box hex"><p>HEX Color</p></div>
    <div class="box rgb">RGB Color</div>
    <div class="box rgba">RGBA Color</div>
  </div>

</body>
</html>
