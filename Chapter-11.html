<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
            background-color: wheat;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .box {
            width: 50%;
            padding: 2rem; 
            margin: 1em 0; 
            font-size: 1.5em;
            background-color: #ffcc00;
            color: black;
            text-align: center;
        }
        .responsive-box {
            width: 50vw; /* vw unit (viewport width) */
            height: 10vh; /* vh unit (viewport height) */
            background-color: #4CAF50;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pixel-box {
            width: 500px;
            height: 100px;
            background-color: #2196F3;
            color: white;
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CSS Units</h1>
        <hr>
        <div class="box">
            This box uses em for font size and margins, and rem for padding.
        </div>
        <br>
        <div class="responsive-box">
            This box uses vw and vh for responsive width and height.
        </div>
        <br>
        <div class="pixel-box">
            <br>This box uses px for exact width and height.
        </div>
    </div>
</body>
</html>
